name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests eval
          ruff format --check src tests eval
      - name: Validate eval cases
        run: |
          python -c "import json; cases=json.load(open('eval/cases.json', encoding='utf-8')); assert len(cases)==30, len(cases); print('cases:', len(cases))"
          python -c "import eval.harness; print('harness import ok')"
      - name: Test
        run: pytest -q
