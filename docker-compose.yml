name: it-service-desk-agent

services:
  agent:
    build: .
    image: it-service-desk-agent:1.0.0
    ports:
      - "8000:8000"
    environment:
      APP_DB_PATH: /app/data/agent.db
      APP_SEED_DIR: /app/seed_data
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      # 真实任务必须提供有效密钥；只写进环境变量，不写入镜像
      LLM_API_KEY: ${LLM_API_KEY:-}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    volumes:
      - agent-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  agent-data:
